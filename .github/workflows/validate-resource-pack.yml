name: 🗂️ Validate Resource Pack

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    name: 🔍 Run Validation
    runs-on: ubuntu-latest
    # Only run if the issue title starts with [VALIDATE]
    if: startsWith(github.event.issue.title, '[VALIDATE]')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install adm-zip
        run: npm install adm-zip

      - name: 🔗 Extract ZIP URL from issue body
        id: extract
        run: |
          BODY=$(cat << 'ISSUEBODY'
          ${{ github.event.issue.body }}
          ISSUEBODY
          )
          # Extract first URL from the issue body
          ZIP_URL=$(echo "$BODY" | grep -oP 'https?://[^\s\)>]+\.zip[^\s\)>]*' | head -1)

          # Fallback: grab any URL if no .zip URL found
          if [ -z "$ZIP_URL" ]; then
            ZIP_URL=$(echo "$BODY" | grep -oP 'https?://[^\s\)>]+' | head -1)
          fi

          if [ -z "$ZIP_URL" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "zip_url=$ZIP_URL" >> $GITHUB_OUTPUT
          fi

      - name: ❌ Comment if no URL found
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ No ZIP URL found\n\nI couldn't find a ZIP download URL in your issue.\n\nMake sure your issue body contains a direct download link ending in \`.zip\`.\n\n**Example:**\n\`\`\`\nhttps://example.com/mypack.zip\n\`\`\`\n\n> Need help? Join the [SMC Discord](https://discord.gg/KwfDra3Pum)`
            })

      - name: 🌐 Download the ZIP
        if: steps.extract.outputs.found == 'true'
        run: |
          echo "⬇️ Downloading: ${{ steps.extract.outputs.zip_url }}"
          curl -L --fail -o input.zip "${{ steps.extract.outputs.zip_url }}"
          echo "✅ Download complete — $(du -sh input.zip | cut -f1)"

      - name: 🔍 Validate the pack
        if: steps.extract.outputs.found == 'true'
        id: validate
        run: |
          node inputzipcheck.js input.zip 2>&1 | tee validation_output.txt
          if grep -q "ZIP IS VALID" validation_output.txt; then
            echo "result=valid" >> $GITHUB_OUTPUT
          else
            echo "result=invalid" >> $GITHUB_OUTPUT
            ERRORS=$(grep "^Error:" validation_output.txt | sed 's/^Error: /- ❌ /' | head -50)
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Comment — Valid
        if: steps.extract.outputs.found == 'true' && steps.validate.outputs.result == 'valid'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Pack is VALID\n\nYour resource pack passed all checks and is compatible with SMCConverter! 🎉\n\n> Need help? Join the [SMC Discord](https://discord.gg/KwfDra3Pum)`
            })
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['valid']
            })
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })

      - name: ❌ Comment — Invalid
        if: steps.extract.outputs.found == 'true' && steps.validate.outputs.result == 'invalid'
        uses: actions/github-script@v7
        env:
          ERRORS: ${{ steps.validate.outputs.errors }}
        with:
          script: |
            const errors = process.env.ERRORS || 'No error details available.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Pack is INVALID\n\nYour resource pack has issues that need to be fixed before it can be used with SMCConverter.\n\n### 🛑 Errors Found\n\n${errors}\n\n---\n> Need help? Join the [SMC Discord](https://discord.gg/KwfDra3Pum)`
            })
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['invalid']
            })
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })
