name: 🗂️ Validate Resource Pack

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install adm-zip

      - name: Extract URL
        id: url
        run: |
          URL=$(echo "${{ github.event.issue.body }}" | grep -oE 'https?://[^ ]+' | head -1)
          if [ -z "$URL" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: No URL found
        if: steps.url.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## ⚠️ No URL Found\n\nPlease paste a direct download link to your ZIP in the issue body.'
            })

      - name: Download ZIP
        if: steps.url.outputs.found == 'true'
        run: curl -L --fail -o input.zip "${{ steps.url.outputs.url }}"

      - name: Run validator
        if: steps.url.outputs.found == 'true'
        id: result
        run: |
          node inputzipcheck.js input.zip 2>&1 | tee out.txt
          if grep -q "ZIP IS VALID" out.txt; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            ERRORS=$(grep "^Error:" out.txt | sed 's/^Error: /- ❌ /')
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post valid comment
        if: steps.url.outputs.found == 'true' && steps.result.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## ✅ Pack is VALID\n\nYour resource pack passed all checks and is compatible with SMCConverter! 🎉\n\n> Need help? Join the [SMC Discord](https://discord.gg/KwfDra3Pum)'
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })

      - name: Post invalid comment
        if: steps.url.outputs.found == 'true' && steps.result.outputs.valid == 'false'
        uses: actions/github-script@v7
        env:
          ERRORS: ${{ steps.result.outputs.errors }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Pack is INVALID\n\nYour pack has issues that need to be fixed.\n\n### Errors\n\n${process.env.ERRORS}\n\n> Need help? Join the [SMC Discord](https://discord.gg/KwfDra3Pum)`
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
